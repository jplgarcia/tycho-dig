[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tycho-dig"
version = "0.1.0"
description = "Replay Cartesi Rollups inputs on a bare machine and compare per-input hashes with a node"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tycho-dig = "tycho_dig.cli:main"

[tool.setuptools]
packages = ["tycho_dig"]
